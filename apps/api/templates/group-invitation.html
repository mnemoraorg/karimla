<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>You're invited to Yappi</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f6f6f6;
      color: #141414;
      font-family: &quot;Bricolage Grotesque&quot;, Arial, sans-serif;
      line-height: 1.5;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#f6f6f6">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 440px"
          >
            <tr>
              <td
                align="center"
                style="padding: 0 0 20px; color: #141414; font-size: 14px; font-weight: 600"
              >
                Yappi <span style="color: #737373; font-weight: 400">by Mnemora</span>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 32px;
                  border: 1px solid rgba(20, 20, 20, 0.12);
                  border-radius: 20px;
                  background: #ffffff;
                "
              >
                <h1
                  style="
                    margin: 0 0 12px;
                    color: #141414;
                    font-size: 24px;
                    font-weight: 600;
                    letter-spacing: -0.5px;
                    line-height: 1.2;
                  "
                >
                  You're invited
                </h1>
                <p style="margin: 0 0 24px; color: #737373; font-size: 15px">
                  Join <strong style="color: #141414">{{.Name}}</strong> on Yappi and count every
                  “{{.Phrase}}”.
                </p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td
                      align="center"
                      style="
                        border: 1px solid #0f0f0f;
                        border-radius: 12px;
                        background: #0f0f0f;
                        padding: 22px 16px;
                      "
                    >
                      <span style="display: block; color: #a3a3a3; font-size: 12px; line-height: 1">
                        INVITE CODE
                      </span>
                      <span
                        style="
                          display: block;
                          padding-top: 12px;
                          color: #f6f6f6;
                          font-size: 28px;
                          font-weight: 600;
                          letter-spacing: 5px;
                          line-height: 1;
                        "
                      >
                        {{.InviteCode}}
                      </span>
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 0; color: #737373; font-size: 14px">
                  <a href="https://yappi.mnemora.org" style="color: #141414; font-weight: 600"
                    >Open Yappi</a
                  >, choose <strong style="color: #141414">Join a group</strong>, and enter this
                  code.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 20px 12px 0; color: #737373; font-size: 13px">
                If you weren't expecting this invitation, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
